[package]
name = "exfilguard"
version = "0.9.0"
edition = "2024"
description = "Rust egress proxy that enforces outbound network policies with TLS interception support."
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3.32"
h2 = "0.4.14"
http = "1.4"
hyper = { version = "1.9", features = ["client", "http1", "http2", "server"] }
lru = "0.18"
nix = { version = "0.31", features = ["fs", "user"] }
once_cell = "1.21"
parking_lot = "0.12"
prometheus = "0.14"
rcgen = { version = "0.14", features = ["x509-parser"] }
regex = "1.12"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "net", "io-util"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
ipnet = { version = "2.12", features = ["serde"] }
time = { version = "0.3", features = ["std"] }
zeroize = "1.8"
blake3 = "1.8"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
config = { version = "0.15", features = ["toml"] }
async-trait = "0.1"
httpdate = "1.0.3"
uuid = { version = "1.23.1", features = ["v4"] }
x509-parser = { version = "0.18", features = ["verify"] }

[features]
fuzzing = []

[dev-dependencies]
assert_matches = "1.5"
nix = { version = "0.31", features = ["signal"] }
tokio = { version = "1.52", features = ["rt", "macros", "test-util"] }
tempfile = "3.27"

[package.metadata.deb]
maintainer = "Ville Laurikari <ville@laurikari.net>"
copyright = "2025 Ville Laurikari"
extended-description = "ExfilGuard is a Rust egress proxy that enforces outbound policies with TLS interception support."
depends = "ca-certificates, systemd"
section = "net"
priority = "optional"
conf-files = [
    "/etc/exfilguard/exfilguard.toml",
    "/etc/exfilguard/clients.toml",
    "/etc/exfilguard/policies.toml",
]
maintainer-scripts = "packaging/deb/scripts"

[[package.metadata.deb.assets]]
source = "target/release/exfilguard"
dest = "usr/sbin/exfilguard"
mode = "0755"

[[package.metadata.deb.assets]]
source = "packaging/deb/systemd/exfilguard.service"
dest = "lib/systemd/system/exfilguard.service"
mode = "0644"

[[package.metadata.deb.assets]]
source = "packaging/deb/sysusers/exfilguard.conf"
dest = "usr/lib/sysusers.d/exfilguard.conf"
mode = "0644"

[[package.metadata.deb.assets]]
source = "packaging/deb/tmpfiles/exfilguard.conf"
dest = "usr/lib/tmpfiles.d/exfilguard.conf"
mode = "0644"

[[package.metadata.deb.assets]]
source = "packaging/deb/config/exfilguard.toml"
dest = "etc/exfilguard/exfilguard.toml"
mode = "0640"

[[package.metadata.deb.assets]]
source = "packaging/deb/config/clients.toml"
dest = "etc/exfilguard/clients.toml"
mode = "0640"

[[package.metadata.deb.assets]]
source = "packaging/deb/config/policies.toml"
dest = "etc/exfilguard/policies.toml"
mode = "0640"
