listen = "127.0.0.1:3128"
proxy_protocol = "off"

ca = { source = "builtin", dir = "/tmp/exfilguard/full-example/ca" }

clients = "clients.toml"
policies = "policies.toml"

log = "text"

# Private upstream exceptions; request policies still apply. Restart to change.
# Use /32 or /128 for a single address.
allow_private_upstream_cidrs = []

# Adaptive HTTP/2 receive-window ceilings in bytes. Growth uses a shared budget.
# Changes require a restart.
http2_stream_window_size = 33554432
http2_connection_window_size = 67108864
# Optional explicit budget; omitted selects an automatic memory-based allowance.
# http2_receive_window_budget = 268435456

# Enable HTTPS on the proxy listener with a certificate for its hostname.
# [proxy_tls]
# source = "files"
# cert = "/etc/exfilguard/proxy.pem"
# key = "/etc/exfilguard/proxy.key"

# Limits for connections awaiting client selection and blocking password checks.
# [authentication]
# max_pending_connections = 128
# max_concurrent_verifications = 4
