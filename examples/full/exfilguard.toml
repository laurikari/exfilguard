listen = "127.0.0.1:3128"
proxy_protocol = "off"

ca = { source = "builtin", dir = "/tmp/exfilguard/full-example/ca" }

clients = "clients.toml"
policies = "policies.toml"

log = "text"

# Private upstream exceptions; request policies still apply. Restart to change.
# Use /32 or /128 for a single address.
allow_private_upstream_cidrs = []

# HTTP/2 receive-window sizes in bytes. Larger windows can improve throughput
# on high-latency links and increase memory use with slow receivers.
# Changes require a restart.
http2_stream_window_size = 33554432
http2_connection_window_size = 67108864
