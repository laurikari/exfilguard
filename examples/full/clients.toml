# SaaS worker tiers mapped by CIDR to enforce different egress needs.
[[client]]
name = "analytics-batch-workers"
cidr = "10.42.16.0/27"
# Optional per-client override; the built-in default is 1024.
max_connections = 2048
policies = [
  "trusted-analytics-egress",
  "fallback-egress-deny",
]

[[client]]
name = "payments-forwarders"
cidr = "10.42.48.0/28"
policies = [
  "pinned-payments-egress",
  "fallback-egress-deny",
]

[[client]]
name = "integration-webhooks"
cidr = "10.42.96.0/28"
policies = [
  "trusted-analytics-egress",
  "pinned-payments-egress",
  "fallback-egress-deny",
]

# Password clients require [proxy_tls]. Generate a hash with exfilguard password-hash.
# [[client]]
# name = "build-worker"
# cidr = "10.42.16.0/27"
# password_hash = '<paste the encoded hash here>'
# policies = ["trusted-analytics-egress", "fallback-egress-deny"]

# Fallback for anonymous requests outside the mapped ranges.
[[client]]
name = "fallback"
policies = [
  "fallback-egress-deny",
]
fallback = true
